{{ $stylesheet := "" }}
{{ if .IsHome }}
  {{ $stylesheet = "css/home.css" }}
{{ else if eq .Section "cv" }}
  {{ $stylesheet = "css/cv.css" }}
{{ end }}
{{ with $stylesheet }}
  {{ $css := resources.Get . | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}" crossorigin="anonymous">
{{ end }}
